<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>商务会议 Business Meeting - BEC Daily</title> <style> *,*::before,*::after{box-sizing:border-box;margin:0;padding:0} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#1a1a2e;line-height:1.8;padding:2rem 2.5rem;max-width:900px;margin:0 auto} .badge{display:inline-block;padding:.25rem .75rem;border-radius:1rem;font-size:.75rem;font-weight:600;background:rgba(109,74,255,0.1);color:#6D4AFF;margin-bottom:1rem} h1{font-size:1.8rem;font-weight:800;margin-bottom:.5rem;color:#1a1a2e}   .section-head{display:flex;align-items:center;margin:2rem 0 1rem;padding-bottom:.5rem;border-bottom:2px solid rgba(109,74,255,0.15)} .section-head-icon{width:28px;height:28px;margin-right:.6rem;flex-shrink:0;color:#6D4AFF} .section-head-icon svg{width:28px;height:28px;display:block} .section-head h2{font-size:1.3rem;font-weight:700;color:#6D4AFF;margin:0;padding:0;border:none;flex:1} .section-head-right{margin-left:auto;flex-shrink:0}  .cn-toggle-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .75rem;border-radius:1rem;border:1.5px solid rgba(109,74,255,0.25);background:#fff;color:#6D4AFF;font-size:.72rem;font-weight:600;cursor:pointer;transition:all .2s;user-select:none;white-space:nowrap} .cn-toggle-btn:hover{background:rgba(109,74,255,0.06)} .cn-toggle-btn.showing{background:var(--accent);color:#fff;border-color:var(--accent);--accent:#6D4AFF} .cn-toggle-dot{width:6px;height:6px;border-radius:50%;background:currentColor}  h3{font-size:1.1rem;font-weight:700;margin:1.5rem 0 .75rem;color:#374151} .dialogue{margin:1.5rem 0} .dialogue-line{display:flex;flex-direction:column;margin-bottom:.75rem;padding:.75rem 1rem;border-radius:.5rem;border-left:3px solid transparent}.dialogue-line-a{background:rgba(59,130,246,0.1);border-left-color:rgba(59,130,246,0.55)}.dialogue-line-b{background:rgba(245,158,11,0.1);border-left-color:rgba(245,158,11,0.55)}  .dialogue-row{display:flex;align-items:flex-start;gap:.75rem} .dialogue-speaker{font-weight:700;color:#6D4AFF;min-width:2rem;flex-shrink:0;line-height:1.8} .dialogue-text{flex:1;line-height:1.8} .dialogue-cn{display:none;padding-top:.4rem;padding-left:2.75rem;color:#6b7280;font-size:.9em;line-height:1.7;border-top:1px dashed rgba(109,74,255,0.1);margin-top:.3rem} body.show-cn .dialogue-cn{display:block}  .vocab-highlight{font-weight:700;color:#6D4AFF}  .roles{margin-bottom:1.5rem;padding:1rem;background:#f9fafb;border-radius:.5rem;font-size:.9rem} .roles strong{color:#6D4AFF} .vocab-item{margin-bottom:.75rem;padding-left:1rem;border-left:3px solid rgba(109,74,255,0.2)} .vocab-item strong{color:#6D4AFF} .pattern-item{margin-bottom:.75rem;padding:.75rem 1rem;background:#f9fafb;border-radius:.5rem} .pattern-item code{background:rgba(109,74,255,0.08);padding:.15rem .4rem;border-radius:.25rem;font-size:.85rem;color:#6D4AFF} .translation-section{display:block} body.show-cn .translation-section{display:none} .translation{margin:1.5rem 0} .translation-line{display:flex;gap:.75rem;margin-bottom:.5rem;padding:.5rem 0;border-bottom:1px dashed rgba(0,0,0,0.05)} .translation-speaker{font-weight:700;color:#6D4AFF;min-width:2rem;flex-shrink:0} .tip{background:linear-gradient(135deg,rgba(109,74,255,0.06),rgba(109,74,255,0.02));padding:1.25rem 1.5rem;border-radius:.75rem;margin-top:2rem;border:1px solid rgba(109,74,255,0.1)} .tip .section-head{border:none;margin-top:0;padding-bottom:0} hr{margin:2rem 0;border:none;border-top:1px solid rgba(0,0,0,0.06)});  </script>  
</body> </html>
